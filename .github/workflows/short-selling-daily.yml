name: KOSPI200 short-selling daily JSON

on:
  schedule:
    # UTC 13:40 = KST 22:40. Disclosure delay is handled separately by a 10-session refresh.
    - cron: '40 13 * * 1-5'
    # 01:00 KST on the following day: retry only if the latest session is missing.
    - cron: '0 16 * * 1-5'
    # 09:00 KST on the following day: final retry if data is still missing.
    - cron: '0 0 * * 2-6'
  workflow_dispatch:
    inputs:
      backfill:
        description: Rebuild the latest one-year window
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: short-selling-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-shorting.txt
      - run: python -m pip install -r requirements-shorting.txt
      - name: Check whether retry is needed
        id: retry-gate
        env:
          SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          if [ "$SCHEDULE" != '0 16 * * 1-5' ] && [ "$SCHEDULE" != '0 0 * * 2-6' ]; then
            echo 'collect=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          from scripts.short_selling.sources import completed_day
          path = Path('data/summary.json')
          latest = completed_day().isoformat()
          previous = json.loads(path.read_text(encoding='utf-8')) if path.exists() else {}
          complete = previous.get('as_of') == latest and previous.get('is_sample') is False and previous.get('schema_version') == 'short-selling.krx-close.v1'
          print('collect=' + ('false' if complete else 'true'))
          PY
      - name: Verify transforms and failure preservation
        if: steps.retry-gate.outputs.collect == 'true'
        run: python -m unittest discover -s scripts/short_selling/tests -v
      - uses: actions/cache@v4
        if: steps.retry-gate.outputs.collect == 'true'
        with:
          path: .shorting-cache
          key: shorting-v1-${{ github.run_id }}
          restore-keys: shorting-v1-
      - name: Probe available sources
        if: steps.retry-gate.outputs.collect == 'true'
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: python -m scripts.short_selling.probe --output logs/short-selling/probe.json
      - name: Collect and validate
        if: steps.retry-gate.outputs.collect == 'true'
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          BACKFILL: ${{ inputs.backfill || 'false' }}
        shell: bash
        run: |
          if [ "$BACKFILL" = "true" ]; then
            python -m scripts.short_selling.collect --backfill
          else
            python -m scripts.short_selling.collect
          fi
      - name: Collect market-alert snapshot
        if: steps.retry-gate.outputs.collect == 'true'
        id: market-alerts
        continue-on-error: true
        run: python -m scripts.short_selling.market_alerts
      - name: Commit validated generation
        if: steps.retry-gate.outputs.collect == 'true'
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
          OWNER: ${{ github.repository_owner }}
          OWNER_ID: ${{ github.event.repository.owner.id }}
        shell: bash
        run: |
          git add -- data/summary.json data/stocks.json data/market_history.json data/constituents.json data/history
          if [ -f data/market_alerts.json ]; then git add -- data/market_alerts.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --author="$OWNER <$OWNER_ID+$OWNER@users.noreply.github.com>" -m 'chore(data): update KOSPI200 short-selling JSON'
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"
      - name: Report market-alert collection failure
        if: steps.market-alerts.outcome == 'failure'
        run: exit 1
      - name: Preserve sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-selling-diagnostics-${{ github.run_id }}
          path: logs/short-selling/
          retention-days: 14
