name: KOSPI200 short-selling daily JSON

on:
  schedule:
    # UTC 13:40 = KST 22:40. Disclosure delay is handled separately by a 10-session refresh.
    - cron: '40 13 * * 1-5'
  workflow_dispatch:
    inputs:
      backfill:
        description: Rebuild the latest one-year window
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: short-selling-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-shorting.txt
      - run: python -m pip install -r requirements-shorting.txt
      - name: Verify transforms and failure preservation
        run: python -m unittest discover -s scripts/short_selling/tests -v
      - uses: actions/cache@v4
        with:
          path: .shorting-cache
          key: shorting-v1-${{ github.run_id }}
          restore-keys: shorting-v1-
      - name: Probe available sources
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python -m scripts.short_selling.probe --output logs/short-selling/probe.json
      - name: Collect and validate
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          BACKFILL: ${{ inputs.backfill || 'false' }}
        shell: bash
        run: |
          if [ "$BACKFILL" = "true" ]; then
            python -m scripts.short_selling.collect --backfill
          else
            python -m scripts.short_selling.collect
          fi
      - name: Collect market-alert snapshot
        id: market-alerts
        continue-on-error: true
        run: python -m scripts.short_selling.market_alerts
      - name: Commit validated generation
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
          OWNER: ${{ github.repository_owner }}
          OWNER_ID: ${{ github.event.repository.owner.id }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          BACKFILL: ${{ inputs.backfill || 'false' }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # The PC lending job can publish the same generation while this run
          # is collecting. Rebuild from the newest version so lending survives.
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            if [ "$(git rev-parse HEAD)" = "$(git rev-parse "origin/$BRANCH")" ]; then break; fi
            git stash push --include-untracked -m 'short-selling pre-refresh' -- data/summary.json data/stocks.json data/market_history.json data/constituents.json data/history data/market_alerts.json
            git merge --ff-only "origin/$BRANCH"
            if [ "$BACKFILL" = "true" ]; then
              python -m scripts.short_selling.collect --backfill
            else
              python -m scripts.short_selling.collect
            fi
            python -m scripts.short_selling.market_alerts
            if [ "$attempt" = "3" ]; then
              git fetch origin "$BRANCH"
              if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$BRANCH")" ]; then
                echo 'Remote changed repeatedly; refusing to overwrite.' >&2
                exit 1
              fi
            fi
          done
          git add -- data/summary.json data/stocks.json data/market_history.json data/constituents.json data/history
          if [ -f data/market_alerts.json ]; then git add -- data/market_alerts.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit --author="$OWNER <$OWNER_ID+$OWNER@users.noreply.github.com>" -m 'chore(data): update KOSPI200 short-selling JSON'
          # A final concurrent push is rejected rather than overwriting data.
          git push origin "HEAD:$BRANCH"
      - name: Report market-alert collection failure
        if: steps.market-alerts.outcome == 'failure'
        run: exit 1
      - name: Preserve sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-selling-diagnostics-${{ github.run_id }}
          path: logs/short-selling/
          retention-days: 14
