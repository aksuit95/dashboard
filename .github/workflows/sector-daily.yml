name: Collect daily Korean market data and deploy to Vercel

on:
  schedule:
    - cron: '0 7 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: Recollect and publish even if today's completed session already exists
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sector-daily-production
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Collect KRX market capitalizations
        id: market-caps
        continue-on-error: true
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: npm run valuation:market-caps:export
      - name: Collect KRX stock returns
        id: stock-returns
        continue-on-error: true
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: npx tsx jobs/stock-returns-export.ts
      - name: Collect proxy closes
        id: proxy-close
        continue-on-error: true
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: npm run proxy-close:export
      - name: Collect Minervini analysis
        id: minervini
        continue-on-error: true
        run: npm run minervini:export
      - name: Collect ADR from Naver KRX closes
        id: adr
        continue-on-error: true
        run: npm run adr:export
      - name: Collect long-term Korean indicators and exchange rate
        id: market-indicators
        continue-on-error: true
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python scripts/market_indicators/collect.py --only kospi kosdaq adr_kospi adr_kosdaq usdkrw
      - name: Collect and validate both indices
        id: sectors
        continue-on-error: true
        shell: bash
        env:
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          for attempt in 1 2 3; do
            if [ "$FORCE" = "true" ]; then
              npm run sectors:export -- --force && break
            else
              npm run sectors:export && break
            fi
            if [ "$attempt" = "3" ]; then exit 1; fi
            sleep 60
          done
      - name: Collect annual consensus estimates
        id: annual-estimates
        if: steps.sectors.outcome == 'success'
        continue-on-error: true
        run: npx tsx jobs/annual-estimates-export.ts
      - name: Collect sector market caps
        id: sector-caps
        continue-on-error: true
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: npx tsx jobs/sector-market-caps-export.ts
      - name: Collect KRX index daily closes
        id: sector-index
        continue-on-error: true
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: npx tsx jobs/sector-index-export.ts
      - name: Commit daily snapshots and trigger Vercel Git deployment
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          OWNER_ID: ${{ github.event.repository.owner.id }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- data/sectors/board.json public/data/market-indicators-live
          if [ -f data/sectors/market-caps.json ]; then
            git add -- data/sectors/market-caps.json
          fi
          if [ -f data/sectors/index-daily.json ]; then
            git add -- data/sectors/index-daily.json
          fi
          if [ -f data/valuation/annual-estimates.json ]; then
            git add -- data/valuation/annual-estimates.json
          fi
          if [ -f data/adr/board.json ]; then
            git add -- data/adr/board.json
          fi
          if [ -f data/valuation/market-caps.json ]; then
            git add -- data/valuation/market-caps.json
          fi
          if [ -f data/stock-returns/board.json ]; then
            git add -- data/stock-returns/board.json
          fi
          if [ -f data/proxy-close/board.json ]; then
            git add -- data/proxy-close/board.json
          fi
          if [ -f data/minervini/board.json ]; then
            git add -- data/minervini/board.json
          fi
          if [ -f data/investor-flow/board.json ]; then
            git add -- data/investor-flow/board.json
          fi
          if git diff --cached --quiet; then
            echo "Already published for the latest completed KRX session."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --author="$OWNER <$OWNER_ID+$OWNER@users.noreply.github.com>" -m 'chore(data): publish daily Korean market snapshots'
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"
      - name: Report collection failures after publishing available results
        if: steps.sectors.outcome == 'failure' || steps.sector-caps.outcome == 'failure' || steps.sector-index.outcome == 'failure' || steps.annual-estimates.outcome == 'failure' || steps.minervini.outcome == 'failure' || steps.proxy-close.outcome == 'failure' || steps.market-caps.outcome == 'failure' || steps.stock-returns.outcome == 'failure' || steps.adr.outcome == 'failure' || steps.market-indicators.outcome == 'failure'
        run: exit 1
