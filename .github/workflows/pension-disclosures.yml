name: Publish National Pension disclosures
on:
  schedule:
    # 18:30 KST, every day. The source returns only submitted filings.
    - cron: '30 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pension-disclosures-production
  cancel-in-progress: false
jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Collect DART filings
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: npm run pension:export
      - name: Publish verified snapshot
        env:
          OWNER: ${{ github.repository_owner }}
          OWNER_ID: ${{ github.event.repository.owner.id }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- data/pension/board.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --author="$OWNER <$OWNER_ID+$OWNER@users.noreply.github.com>" -m 'chore(data): refresh national pension disclosures'
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
          done
          exit 1
