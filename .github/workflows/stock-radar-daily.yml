name: Collect closing prices for the stock radar

on:
  schedule:
    - cron: '0 9 * * 1-5' # 18:00 KST, after the regular close
    - cron: '20 23 * * 0-4' # 08:20 KST, confirm with KRX Open API
  workflow_dispatch:
    inputs:
      force:
        description: Recollect the latest completed session
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Serialize Git snapshot publications with the existing Korean market batch.
  group: sector-daily-production
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/cache/restore@v4
        id: history
        with:
          path: tmp/stock-radar/krx-v1
          key: stock-radar-krx-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: stock-radar-krx-v1-
      - name: Collect and verify KRX closing prices
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          FORCE: ${{ inputs.force || 'false' }}
        shell: bash
        run: |
          args=()
          if [[ "$FORCE" == 'true' ]]; then args+=(--force); fi
          for attempt in 1 2 3; do
            if npm run stock-radar:export -- "${args[@]}"; then exit 0; fi
            if [[ "$attempt" != '3' ]]; then sleep 60; fi
          done
          exit 1
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.history.outputs.cache-hit != 'true' }}
        with:
          path: tmp/stock-radar/krx-v1
          key: ${{ steps.history.outputs.cache-primary-key }}
      - name: Publish the verified snapshot
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          OWNER_ID: ${{ github.event.repository.owner.id }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ ! -f data/stock-radar/board.json ]]; then exit 0; fi
          git add -- data/stock-radar/board.json
          if [[ -f data/index-technical/breadth.json ]]; then git add -- data/index-technical/breadth.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --author="$OWNER <$OWNER_ID+$OWNER@users.noreply.github.com>" -m 'chore(data): publish KRX stock radar'
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"
